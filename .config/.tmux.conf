set -g default-terminal "tmux-256color"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"' 
bind - split-window -v

unbind r
bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# Bind Ctrl+Tab to next window
bind-key -n C-Tab next-window

# Bind Ctrl+Shift+Tab to previous window
bind-key -n C-S-Tab previous-window

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

#tpm plugin
set -g @plugin 'tmux-plugins/tpm'

#list of tpm plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sesion after restarts.
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves session in every 15 mins. 
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_text " #{=10:window_name} "


# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_weather}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Key bind for tmux-sessionx
set -g @sessionx-bind 'o'

# make sure it's always at the bottom of the file.
run '~/.tmux/plugins/tpm/tpm'

# Enable extended keys — pi/Smriti console needs modified-Enter to submit tool calls.
# Without this, tmux eats the keypress and tool calls silently never fire.
set -g extended-keys on

# ── Pane monitoring — let agents call YOU instead of you polling them ──
# Claude Code rings the terminal bell when a session needs you (waiting/done).
# tmux flags the pane's window in the status bar so you can work elsewhere and
# glance up when a pane wants attention. Fire-and-forget across panes.
set -g monitor-bell on          # flag window when a pane rings the bell (agent needs you)
set -g monitor-activity on      # flag window on any new output (agent produced something)
set -g visual-bell on           # show a status-line message instead of an audible beep
set -g visual-activity off      # activity flags the window but doesn't spam messages
set -g bell-action other        # bell in any window (not just current) raises the flag
set -g activity-action other
# Make flagged windows visually obvious in the status bar
setw -g window-status-bell-style 'fg=black,bg=red,bold'
setw -g window-status-activity-style 'fg=black,bg=yellow'
